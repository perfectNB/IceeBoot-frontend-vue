<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- 外圈齿轮 -->
  <g transform="translate(60,60)">
    <!-- 齿轮齿 -->
    <g fill="#409EFF">
      <rect x="-3" y="-55" width="6" height="10" rx="2"/>
      <rect x="-3" y="45" width="6" height="10" rx="2"/>
      <rect x="-55" y="-3" width="10" height="6" rx="2"/>
      <rect x="45" y="-3" width="10" height="6" rx="2"/>
      
      <!-- 斜向齿 -->
      <rect x="-2.1" y="-2.1" width="6" height="10" rx="2" transform="rotate(45) translate(0,-50)"/>
      <rect x="-2.1" y="-2.1" width="6" height="10" rx="2" transform="rotate(135) translate(0,-50)"/>
      <rect x="-2.1" y="-2.1" width="6" height="10" rx="2" transform="rotate(225) translate(0,-50)"/>
      <rect x="-2.1" y="-2.1" width="6" height="10" rx="2" transform="rotate(315) translate(0,-50)"/>
    </g>
    
    <!-- 主体圆环 -->
    <circle cx="0" cy="0" r="45" fill="#409EFF" stroke="#79BBFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="35" fill="#FFFFFF"/>
    
    <!-- Z字母设计 -->
    <g fill="#409EFF">
      <!-- Z的上横线 -->
      <rect x="-18" y="-15" width="36" height="6" rx="3"/>
      <!-- Z的下横线 -->
      <rect x="-18" y="9" width="36" height="6" rx="3"/>
      <!-- Z的斜线 -->
      <rect x="-2" y="-12" width="4" height="24" rx="2" transform="rotate(-25)"/>
      
      <!-- 装饰性小齿轮 -->
      <circle cx="20" cy="-20" r="8" fill="#79BBFF" opacity="0.8"/>
      <circle cx="20" cy="-20" r="5" fill="#FFFFFF"/>
      <rect x="18" y="-22" width="4" height="1.5" rx="0.5" fill="#79BBFF"/>
      <rect x="18" y="-19.5" width="4" height="1.5" rx="0.5" fill="#79BBFF"/>
      <rect x="18" y="-17" width="4" height="1.5" rx="0.5" fill="#79BBFF"/>
      <rect x="19" y="-23" width="1.5" height="4" rx="0.5" fill="#79BBFF"/>
      <rect x="20.5" y="-23" width="1.5" height="4" rx="0.5" fill="#79BBFF"/>
    </g>
    
    <!-- 内圈装饰 -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#A0CFFF" stroke-width="1" opacity="0.6"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#D9ECFF" stroke-width="1" opacity="0.4"/>
    
    <!-- 光泽效果 -->
    <ellipse cx="-15" cy="-15" rx="8" ry="12" fill="#FFFFFF" opacity="0.3" transform="rotate(-30)"/>
  </g>
</svg>