<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:1" />
    </linearGradient>

    <!-- 光泽效果 -->
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>

    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆环 -->
  <circle cx="60" cy="60" r="56" fill="url(#accentGradient)" opacity="0.15"/>

  <!-- 主体设计 - 六边形科技感 -->
  <g transform="translate(60,60)" filter="url(#shadow)">
    <!-- 外层六边形 -->
    <path d="M 0,-50 L 43.3,-25 L 43.3,25 L 0,50 L -43.3,25 L -43.3,-25 Z"
          fill="url(#primaryGradient)"
          stroke="#1E40AF"
          stroke-width="1.5"
          opacity="0.95"/>

    <!-- 中层六边形 -->
    <path d="M 0,-40 L 34.64,-20 L 34.64,20 L 0,40 L -34.64,20 L -34.64,-20 Z"
          fill="#FFFFFF"
          opacity="0.98"/>

    <!-- 内层装饰六边形 -->
    <path d="M 0,-30 L 25.98,-15 L 25.98,15 L 0,30 L -25.98,15 L -25.98,-15 Z"
          fill="none"
          stroke="url(#secondaryGradient)"
          stroke-width="1.5"
          opacity="0.6"/>

    <!-- 中心 "I" 字母设计 (代表 IceeBoot) -->
    <g fill="url(#primaryGradient)">
      <!-- I 的主体 -->
      <rect x="-3" y="-20" width="6" height="40" rx="3"/>

      <!-- I 的上装饰 -->
      <rect x="-8" y="-22" width="16" height="4" rx="2"/>

      <!-- I 的下装饰 -->
      <rect x="-8" y="18" width="16" height="4" rx="2"/>

      <!-- 科技感装饰线条 -->
      <rect x="-1" y="-12" width="2" height="8" rx="1" opacity="0.6"/>
      <rect x="-1" y="4" width="2" height="8" rx="1" opacity="0.6"/>
    </g>

    <!-- 动态装饰元素 - 左侧 -->
    <g opacity="0.7">
      <circle cx="-25" cy="-15" r="3" fill="url(#secondaryGradient)"/>
      <circle cx="-28" cy="0" r="2" fill="url(#secondaryGradient)"/>
      <circle cx="-25" cy="15" r="3" fill="url(#secondaryGradient)"/>
      <line x1="-25" y1="-12" x2="-28" y2="-2" stroke="url(#secondaryGradient)" stroke-width="1"/>
      <line x1="-28" y1="2" x2="-25" y2="12" stroke="url(#secondaryGradient)" stroke-width="1"/>
    </g>

    <!-- 动态装饰元素 - 右侧 -->
    <g opacity="0.7">
      <circle cx="25" cy="-15" r="3" fill="url(#secondaryGradient)"/>
      <circle cx="28" cy="0" r="2" fill="url(#secondaryGradient)"/>
      <circle cx="25" cy="15" r="3" fill="url(#secondaryGradient)"/>
      <line x1="25" y1="-12" x2="28" y2="-2" stroke="url(#secondaryGradient)" stroke-width="1"/>
      <line x1="28" y1="2" x2="25" y2="12" stroke="url(#secondaryGradient)" stroke-width="1"/>
    </g>

    <!-- 顶部装饰 -->
    <g opacity="0.6">
      <path d="M -8,-28 L 0,-35 L 8,-28"
            fill="none"
            stroke="url(#secondaryGradient)"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- 底部装饰 -->
    <g opacity="0.6">
      <path d="M -8,28 L 0,35 L 8,28"
            fill="none"
            stroke="url(#secondaryGradient)"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- 光泽效果 -->
    <ellipse cx="-12" cy="-18" rx="10" ry="15"
             fill="url(#glowGradient)"
             opacity="0.4"
             transform="rotate(-25)"/>

    <!-- 微小装饰点 -->
    <circle cx="0" cy="-25" r="1.5" fill="#3B82F6" opacity="0.8"/>
    <circle cx="0" cy="25" r="1.5" fill="#3B82F6" opacity="0.8"/>
    <circle cx="-22" cy="0" r="1.5" fill="#3B82F6" opacity="0.8"/>
    <circle cx="22" cy="0" r="1.5" fill="#3B82F6" opacity="0.8"/>
  </g>

  <!-- 外圈装饰环 -->
  <circle cx="60" cy="60" r="54"
          fill="none"
          stroke="url(#secondaryGradient)"
          stroke-width="0.5"
          opacity="0.3"/>

  <!-- 最外层光晕 -->
  <circle cx="60" cy="60" r="58"
          fill="none"
          stroke="#DBEAFE"
          stroke-width="0.5"
          opacity="0.2"/>
</svg>
